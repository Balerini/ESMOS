<main class="transaction-detail">
  <!-- Header -->
  <div class="transaction-header">
    <button class="back-button" onclick="loadPage('billing')">←</button>
    <h2 class="summary-title">June 2025 Usage Summary</h2>
  </div>

  <!-- Summary Bar Chart -->
  <div class="summary-chart">
    <canvas id="summaryChart" height="160"></canvas>
  </div>

  <!-- Usage Gauges -->
  <div class="gauge-row">
    <!-- Electricity -->
    <div class="gauge-card">
      <canvas id="gaugeElectricity" class="gauge-canvas" width="100" height="100"></canvas>
      <div class="gauge-usage">
        <strong>335 kWh</strong>
        <div class="gauge-ref">of 600 kWh used</div>
        <div class="gauge-delta red">▼ 10%</div>
        <div class="gauge-title">Electricity</div>
      </div>
    </div>

    <!-- Water -->
    <div class="gauge-card">
      <canvas id="gaugeWater" class="gauge-canvas" width="100" height="100"></canvas>
      <div class="gauge-usage">
        <strong>18 Cu M</strong>
        <div class="gauge-ref">of 40 Cu M</div>
        <div class="gauge-delta green">▲ 5%</div>
        <div class="gauge-title">Water</div>
      </div>
    </div>

    <!-- Gas -->
    <div class="gauge-card">
      <canvas id="gaugeGas" class="gauge-canvas" width="100" height="100"></canvas>
      <div class="gauge-usage">
        <strong>160 kWh</strong>
        <div class="gauge-ref">of 500 kWh used</div>
        <div class="gauge-delta green">▲ 4%</div>
        <div class="gauge-title">Gas</div>
      </div>
    </div>
  </div>

  <!-- Bill Summary -->
  <div class="bill-summary" id="billSummary">
    <div class="bill-summary-header">
      <div id="billStatus" class="bill-status paid">Status: PAID</div>
    </div>
  
    <h3>Current Bill</h3>
    <p>Your total bill is:</p>
  
    <div class="bill-amount-row">
      <h1 id="billAmount" class="bill-amount strike text-grey">$145.00</h1>
      <button id="payButton" class="pay-button paid-button" disabled>Paid</button>
    </div>
  
    <p class="bill-description">
      On average, your total bill in June is 3.5% higher than May
    </p>
  </div>
</main>

<script>
  // Summary chart (random values for June)
  const summaryChart = document.getElementById("summaryChart");
  new Chart(summaryChart, {
    type: 'bar',
    data: {
      labels: ["Electricity", "Water", "Gas"],
      datasets: [{
        label: "Usage",
        data: [335, 18, 160], // random data for June
        backgroundColor: ["#FF4B4B", "#57A5F6", "#00FF99"],
        borderRadius: 8,
        barThickness: 40
      }]
    },
    options: {
      plugins: {
        legend: { display: false },
        tooltip: { enabled: true }
      },
      scales: {
        y: { ticks: { color: "#fff" }, grid: { color: "#444" } },
        x: { ticks: { color: "#fff" }, grid: { display: false } }
      }
    }
  });

  // Gauge charts (random data for June)
  function renderGaugeChart(id, used, total, color) {
    const canvas = document.getElementById(id);
    if (!canvas) return;

    new Chart(canvas, {
      type: "doughnut",
      data: {
        datasets: [{
          data: [used, total - used],
          backgroundColor: [color, "#2b2b2b"],
          borderWidth: 0,
          cutout: "70%",
          circumference: 180,
          rotation: 270
        }]
      },
      options: {
        responsive: false,
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } }
      }
    });
  }

  renderGaugeChart("gaugeElectricity", 335, 600, "#FF4B4B");
  renderGaugeChart("gaugeWater", 18, 40, "#57A5F6");
  renderGaugeChart("gaugeGas", 160, 500, "#00FF99");
</script>
